phases:
  install:
    runtime-versions:
      python: 3.10
    commands:
      - echo Installing dependencies...
      - pip install --upgrade pip
      - pip install -r requirements.txt
      - pip install databricks-cli databricks-sdk
      - export PATH=$PATH:/root/.local/bin
      - echo Verifying Databricks CLI...
      - which databricks

